name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Static documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate public documentation
        run: python3 scripts/validate-docs.py

      - name: Validate landing-page HTML
        run: npx --yes html-validate@8 docs/index.html

  xcode:
    name: Xcode 26.6 / Swift 6
    runs-on: macos-26
    env:
      ARTIFACTS: ${{ github.workspace }}/artifacts
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select pinned Node packaging toolchain
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked packaging tooling
        run: npm ci --no-audit --no-fund

      - name: Verify and record runner toolchain
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || {
            find /Applications -maxdepth 1 -name 'Xcode*' -print
            exit 1
          }
          mkdir -p "$ARTIFACTS"
          {
            sw_vers
            uname -m
            echo "ImageOS=${ImageOS:-unset}"
            echo "ImageVersion=${ImageVersion:-unset}"
            EXPECTED_NODE_VERSION="v$(< .nvmrc)"
            ACTUAL_NODE_VERSION="$(node --version)"
            echo "Node expected=$EXPECTED_NODE_VERSION"
            echo "Node actual=$ACTUAL_NODE_VERSION"
            test "$ACTUAL_NODE_VERSION" = "$EXPECTED_NODE_VERSION"
            echo "npm=$(npm --version)"
            echo "npx=$(npx --version)"
            xcode-select -p
            xcodebuild -version
            xcrun swift --version
            xcodebuild -showsdks
            xcrun --find xcresulttool
          } 2>&1 | tee "$ARTIFACTS/toolchain.txt"

      - name: Test release hardening (offline mocks)
        run: /bin/bash ./scripts/test-release-hardening.sh

      - name: Build and package release configuration
        run: |
          set -euo pipefail
          ./scripts/build-release.sh 0.0.0 2>&1 | tee "$ARTIFACTS/xcodebuild-release.log"
          test -d build/Release/MobCrew.app
          codesign --verify --deep --strict build/Release/MobCrew.app
          codesign --display --verbose=4 build/Release/MobCrew.app \
            2> "$ARTIFACTS/codesign.txt"
          plutil -p build/Release/MobCrew.app/Contents/Info.plist \
            > "$ARTIFACTS/Info.plist.txt"
          ditto -c -k --keepParent build/Release/MobCrew.app \
            "$ARTIFACTS/MobCrew.app.zip"

      - name: Create and verify DMG
        run: |
          set -euo pipefail
          ./scripts/create-dmg.sh 0.0.0 \
            2>&1 | tee "$ARTIFACTS/create-dmg.log"
          hdiutil verify build/MobCrew-0.0.0.dmg \
            2>&1 | tee "$ARTIFACTS/hdiutil-verify.log"
          ./scripts/verify-release-artifact.sh build/MobCrew-0.0.0.dmg 0.0.0 \
            "$ARTIFACTS/MobCrew-0.0.0.verification"
          cp build/MobCrew-0.0.0.dmg* "$ARTIFACTS/"

      - name: Run complete test suite
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/MobCrewDerivedData"
          rm -rf "$DERIVED_DATA" "$ARTIFACTS/MobCrewTests.xcresult"
          xcodebuild test \
            -project MobCrew/MobCrew.xcodeproj \
            -scheme MobCrew \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:MobCrewTests \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$ARTIFACTS/MobCrewTests.xcresult" \
            2>&1 | tee "$ARTIFACTS/xcodebuild-tests.log"

      - name: Export test summary
        if: always()
        run: |
          if [[ -d "$ARTIFACTS/MobCrewTests.xcresult" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$ARTIFACTS/MobCrewTests.xcresult" \
              > "$ARTIFACTS/MobCrewTests-summary.json" || true
          fi

      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobcrew-xcode-26.6-evidence-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
